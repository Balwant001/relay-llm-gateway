services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: relay, POSTGRES_PASSWORD: relay, POSTGRES_DB: relay }
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U relay"], interval: 5s, retries: 10 }
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 10 }
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql+psycopg2://relay:relay@db:5432/relay
      REDIS_URL: redis://redis:6379/0
      ADMIN_KEY: admin-dev-key
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
  prometheus:          # optional: http://localhost:9090
    image: prom/prometheus:latest
    volumes: ["./prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]
    depends_on: [api]
  grafana:             # optional: http://localhost:3000 (admin / admin), add Prometheus at http://prometheus:9090
    image: grafana/grafana:latest
    ports: ["3000:3000"]
    depends_on: [prometheus]
volumes:
  pgdata:
